# PROJECT SETTINGS


# [RTOS related settings]
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
# end of [RTOS related settings]


# [Debug related settings]
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
# end of [Debug related settings]


# [logs related settings]
CONFIG_LOG=y
# CONFIG_LOG_MAX_LEVEL=2
# CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_INFO_COLOR_GREEN=y
CONFIG_LOG_SPEED=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
# CONFIG_LOG_BLOCK_IN_THREAD=y
# end of [logs related settings]


# [BLE related settings]
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ATT_PREPARE_COUNT=5
CONFIG_BT_DEVICE_NAME="UniversalBLE-HIL"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# end of [BLE related settings]
